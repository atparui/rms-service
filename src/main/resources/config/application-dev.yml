# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
    com.atparui.rmsservice: DEBUG
    com.atparui.rmsservice.broker: INFO

management:
  endpoints:
    jmx:
      exposure:
        exclude: '*'
  health:
    elasticsearch:
      enabled: false
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  jmx:
    enabled: false
  cloud:
    consul:
      config:
        enabled: true
        fail-fast: false # if not in "prod" profile, do not force to use Spring Cloud Config
        format: yaml
        profile-separator: '-'
      discovery:
        healthCheckPath: /management/health/readiness
        prefer-ip-address: false
        hostname: host.docker.internal
        tags:
          - profile=${spring.profiles.active}
          - version='@project.version@'
          - git-version=@git.commit.id.describe@
          - git-commit=@git.commit.id.abbrev@
          - git-branch=@git.branch@
      host: localhost
      port: 8500
      enabled: true
      health:
        enabled: true
        path: /management/health/readiness
        probes:
          enabled: true
        group:
          liveness:
            include: livenessState
          readiness:
            include: readinessState
  elasticsearch:
    uris: http://localhost:9200
  liquibase:
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: dev, faker
    url: jdbc:postgresql://localhost:5432/rms-service?ssl=false&sslmode=disable&TimeZone=UTC
    user: rms-service
    # Use DB_PASSWORD environment variable if set, otherwise default to 'rms-service' for local development
    password: ${DB_PASSWORD:rms-service}
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/rms-service
    username: rms-service
    # Use DB_PASSWORD environment variable if set, otherwise default to 'rms-service' for local development
    password: ${DB_PASSWORD:rms-service}
  thymeleaf:
    cache: false

server:
  port: 8083
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  # CORS is disabled on the microservice; the gateway handles CORS to avoid duplicate Access-Control-Allow-Origin headers.
  logging:
  level:
    org.springframework.r2dbc.core: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above

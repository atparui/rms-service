# ===================================================================
# P6Spy Configuration
# SQL Logging and Performance Monitoring for Development
# ===================================================================

# Module List (comma-separated)
modulelist=com.p6spy.engine.logging.P6LogFactory

# Real Driver
# This will be automatically detected from the JDBC URL
driverlist=org.postgresql.Driver

# Custom Log Message Format
# Available variables:
# %(connectionId)   - Connection ID
# %(currentTime)    - Current timestamp
# %(executionTime)  - Query execution time in milliseconds
# %(category)       - Category (statement, resultset, commit, rollback, batch)
# %(effectiveSql)   - SQL with actual parameter values
# %(sql)            - SQL with ? placeholders
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | took %(executionTime)ms | connection %(connectionId) | category: %(category) | %n%(effectiveSql)%n

# Appender Configuration
# console: Log to console
# file: Log to file (see logfile property)
appender=com.p6spy.engine.spy.appender.StdoutLogger

# File Logging Configuration (if using file appender)
# logfile=spy.log
# append=true

# Date Format
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Log Level
# Options: fatal, error, warn, info, debug, trace
# Set to 'debug' or 'info' for SQL logging
# Filter slow queries (0 = log all queries)
# Set to a value in milliseconds to only log slow queries
# Example: 1000 = only log queries taking more than 1 second
executionThreshold=0

# Exclude Categories (comma-separated)
# Options: error, info, batch, debug, statement, commit, rollback, result, resultset
# Leave empty to log everything
excludecategories=info,debug,result,resultset

# Database Dialect
# Formats SQL for better readability
databaseDialectDateFormat=yyyy-MM-dd HH:mm:ss.SSS

# Log Filter
# Regular expression to filter out specific SQL statements
# Example: filter.* = exclude.*|include.*
# Leave empty to log everything
# filter=

# Exclude tables from logging (comma-separated regex patterns)
# Example: excludeTables=.*_tmp,.*_temp
# excludeTables=

# Use Prepared Statement logging
# Shows actual parameter values instead of ?
useprefix=false
# autoflush=true

# Stack Trace
# stacktrace=false
# stacktraceclass=

# Reload Configuration
# reloadproperties=false
# reloadpropertiesinterval=60

# JMX Support
# jmx=true

# Real Data Source Properties
# Only needed if using DataSource instead of DriverManager
# realdatasource=
# realdatasourceclass=
# realdatasourceproperties=

# ===================================================================
# Performance Settings
# ===================================================================

# Outage Detection
# Logs queries taking longer than specified milliseconds
outagedetection=true
outagedetectioninterval=10000

# ===================================================================
# SQL Formatting (optional - uncomment to enable)
# ===================================================================
# Format SQL for better readability
# Requires sqlformatter module (not included by default)
# sqlformatter=com.p6spy.engine.logging.P6LogFormatter

# ===================================================================
# Filtering Configuration
# ===================================================================

# Include only specific SQL patterns (regex)
# Example: include=^SELECT.*|^INSERT.*
# Leave empty to include everything
# include=

# Exclude health check and monitoring queries
# Uncomment to reduce noise in logs
# exclude=select 1|SELECT 1|health|actuator|information_schema

# ===================================================================
# Additional Settings for Multi-tenant Applications
# ===================================================================

# Log SQL for all tenants
# No tenant-specific filtering needed - all SQL will be logged
